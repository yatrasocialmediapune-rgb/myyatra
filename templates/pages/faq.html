<div class="two-col two-col--faq">
  <div class="faq">{{{faqHtml}}}</div>
  <div class="cta-band" style="grid-template-columns:1fr" data-reveal>
    {{svg rangoli}}
    <div>
      <p class="eyebrow">Still curious?</p>
      <h2 style="font-size:var(--fs-h3)">Ask us <span class="accent">anything.</span></h2>
      <p style="margin-top:10px">Our team usually replies on WhatsApp during working hours ({{site.hours}}).</p>
    </div>
    <div class="cta-band__actions">
      <a class="btn btn--primary" href="{{waGeneral}}" target="_blank" rel="noopener"><svg class="icon"><use href="#i-whatsapp"/></svg> WhatsApp us</a>
    </div>
  </div>
</div>
