<section class="lost">
  <div class="container">
    <div class="lost__ticket">
      <p class="meta">{{t.e404.ticket}}</p>
      <p class="lost__code" aria-hidden="true">4<span>0</span>4</p>
      <h1 class="h3">{{t.e404.title}}</h1>
      <p>{{t.e404.text}}</p>
      <div class="bpass__perf" aria-hidden="true"></div>
      <form class="searchbox" action="{{lp}}/tours/" method="get" role="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="search" name="q" placeholder="{{t.e404.searchPlaceholder}}" aria-label="{{t.tours.searchAria}}">
      </form>
      <div class="lost__actions">
        <a class="btn btn--primary" href="{{lp}}/tours/">{{t.e404.browse}} <svg class="icon icon--arrow"><use href="#i-arrow"/></svg></a>
        <a class="btn btn--outline" href="{{home}}">{{t.e404.home}}</a>
      </div>
      <div class="chip-row" style="justify-content:center">{{{popularLinks}}}</div>
    </div>
  </div>
</section>
